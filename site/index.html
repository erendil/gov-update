<div class="blk" id="blk0"><div class="col"><div class="prose"><header class="top"><h1>Actualité gouvernementale et parlementaire</h1><p class="lead">Compte rendu du mois d'octobre 2026</p><p class="meta">Établi le 7 novembre 2026 · sources officielles uniquement (Élysée, Assemblée nationale, Sénat, HATVP, Eurostat, OCDE…) · sigles écrits en clair, lexique en fin de document</p><div class="how"><b>Comment lire ce rapport</b><p>Chaque section commence par un encadré vert « En clair » : une ou deux phrases simples qui résument l'essentiel. Si vous n'avez que trois minutes, lisez seulement ces encadrés. Les tableaux et graphiques donnent le détail ; le schéma de la section 10 explique comment une loi se fabrique, et la colonne « Étape » des tableaux y renvoie. Tous les mots techniques sont expliqués dans le lexique (section 13).</p></div></header></div></div></div><div class="blk" id="blk1"><div class="col"><div class="prose"><h2 class="sec" id="sec1">1. L&#x27;essentiel du mois</h2><div class="clair"><b>EN CLAIR</b><p>En octobre, le Parlement a dit non au budget 2027 proposé par le gouvernement, sans proposer autre chose à la place. Résultat : les agences qui notent la France ont pris peur, et le dossier repart au Sénat.</p></div><p class="">Le budget, c&#x27;est la liste des dépenses et des impôts de l&#x27;année prochaine. Déposé le 1er octobre, il a été démonté par une Assemblée sans majorité : budget de la Sécu rejeté le 23 octobre (115 contre 1), budget de l&#x27;État le 4 novembre (458 contre 0). Pas de 49.3 ; les deux textes repartent au Sénat.</p><p class="">Hors budget : un projet de loi nucléaire (14 octobre), une loi contre les ingérences étrangères votée à l&#x27;unanimité au Sénat (20 octobre), l&#x27;autonomie de la Corse refusée par le Sénat (26 octobre), et des annonces du Premier ministre face aux lycéens, aux prix des carburants et aux agriculteurs (7 octobre).</p><p class="">Côté classements : l&#x27;Agence France Trésor annonce la revue de Fitch le 30 octobre et celle de S&amp;P le 27 novembre ; une baisse de la note rendrait les emprunts de la France plus chers.</p></div></div></div><div class="blk" id="blk2"><div class="col"><div class="prose"><h2 class="sec" id="sec2">2. Le gouvernement en octobre</h2><div class="clair"><b>EN CLAIR</b><p>Le gouvernement, c&#x27;est le Premier ministre et ses ministres : ils préparent les lois et dirigent l&#x27;administration. En octobre, il a surtout présenté le budget, un texte sur le nucléaire, et répondu à trois crises (lycéens, carburants, agriculteurs).</p></div><p class="sub">Gouvernement Lecornu II, minoritaire, en place depuis le 10 octobre 2025 ; aucun changement en octobre (organigramme en section 11).</p></div></div></div><div class="blk hasside pair" id="blk3" data-pair="gouv">

</div><div class="blk" id="blk7"><div class="col"><div class="prose"><h2 class="sec" id="sec4">4. Zoom sur un texte : le budget 2027</h2><div class="clair"><b>EN CLAIR</b><p>Le gouvernement voulait réduire le déficit, c&#x27;est-à-dire l&#x27;écart entre ce que l&#x27;État dépense et ce qu&#x27;il gagne, en économisant 43 milliards d&#x27;euros. Les députés ont rejeté le plan sans en proposer un autre. Le Sénat prend le relais en novembre.</p></div><p class="sub">Deux textes déposés le 1er octobre (État n° 3210, Sécu n° 3211), rejetés par l&#x27;Assemblée ; pas de 49.3 ; retour au Sénat sur le texte initial.</p></div></div></div><div class="blk hasside pair" id="blk8" data-pair="fiche">

</div><div class="blk" id="blk9"><div class="col"><div class="prose"><h3>Les chiffres du projet</h3><div class="tiles"><div class="tile"><span class="tl">Déficit public visé 2027</span><span class="tv">5,0 %</span><span class="ts">contre 5,4 % en 2026</span></div><div class="tile"><span class="tl">Dette publique fin 2027</span><span class="tv">121,7 %</span><span class="ts">119,3 % fin 2026</span></div><div class="tile"><span class="tl">Charge d&#x27;intérêts 2027</span><span class="tv">91,2 Md€</span><span class="ts">79,2 Md€ en 2026</span></div><div class="tile"><span class="tl">Mesures nouvelles</span><span class="tv">43 Md€</span><span class="ts">25 en économies, 18 en recettes</span></div><div class="tile"><span class="tl">Déficit Sécu visé 2027</span><span class="tv">12,7 Md€</span><span class="ts">21,8 Md€ attendus en 2026</span></div></div><p class="">Le Haut Conseil des finances publiques (expert indépendant) juge la croissance 2027 « optimiste », l&#x27;effort réel à 28 Md€ et le retour sous 3 % de déficit en 2029 « très peu vraisemblable ».</p><h3>Principales mesures proposées</h3><ul><li>Pas de hausse générale d&#x27;impôt ; barème de l&#x27;impôt sur le revenu indexé sur l&#x27;inflation.</li><li>Retraités : abattement de 10 % plafonné à 3 000 € (contre 4 439 €) ; pensions au-dessus de 1 260 € par mois gelées ou sous-indexées (4,1 Md€ d&#x27;économies).</li><li>Grandes entreprises : surtaxe exceptionnelle prolongée un an mais réduite d&#x27;un tiers ; contribution minimale de 20 % sur les très hauts revenus prolongée.</li><li>Fonction publique : point d&#x27;indice gelé, 1 076 postes supprimés ; prestations familiales et aides au logement non revalorisées ; crédits des ministères gelés sauf Défense (+6,5 Md€).</li><li>Santé : dépenses d&#x27;assurance maladie limitées à +2 % (+3 % pour les hôpitaux), suivi renforcé des arrêts de travail longs, 5,1 Md€ d&#x27;économies sur les soins, extension de la taxe sur les sodas.</li><li>Entreprises : suramortissement de 30 % (60 % pour les très petites) pour la reprise par les salariés (« pacte Papin ») ; régime des locations meublées durci ; nouvelles taxes sur les grandes infrastructures de transport, le kérosène et les avoirs en déshérence.</li></ul></div></div></div><div class="blk hasside pair" id="blk10" data-pair="votes">

</div><div class="blk" id="blk11"><div class="col"><div class="prose"><p class="">Chaque camp a supprimé les mesures de l&#x27;autre ; le texte final ne convenait plus à personne. Délais : 50 jours pour la Sécu, 70 pour l&#x27;État (17 décembre). Au-delà : ordonnance ou loi spéciale, comme en 2024 et 2025.</p></div></div></div><div class="blk hasside" id="blk12"><div class="col"><div class="prose"><h2 class="sec" id="sec5">5. Ce qu&#x27;octobre change pour les classements internationaux</h2><div class="clair"><b>EN CLAIR</b><p>Des organismes publics (Union européenne, OCDE, FMI, ONU) comparent les pays : qui est le plus endetté, où les élèves ont le meilleur niveau, où l&#x27;on juge la corruption répandue. En octobre, rien n&#x27;a bougé pour l&#x27;école ni la corruption, et la dette reste un point faible.</p></div><div class="tblwrap"><table class="rt"><colgroup><col style="width:20.0%"><col style="width:31.1%"><col style="width:48.9%"></colgroup><thead><tr><th>Classement</th><th>Dernière position de la France</th><th>Ce qu&#x27;octobre change</th></tr></thead><tbody><tr class="det" data-detail="{&quot;titre&quot;: &quot;Notation de la dette (Fitch)&quot;, &quot;champs&quot;: [[&quot;Classement&quot;, &quot;Notation de la dette (Fitch)&quot;], [&quot;Dernière position de la France&quot;, &quot;Revue prévue le 30 octobre 2026 (calendrier de l&#x27;Agence France Trésor) ; résultat non vérifié dans une source officielle&quot;], [&quot;Ce qu&#x27;octobre change&quot;, &quot;Le rejet du budget à 458 voix contre 0 (scrutin public de l&#x27;Assemblée) reste le principal risque pour la note.&quot;]], &quot;source&quot;: &quot;https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2026-2027/troisieme-seance-du-vendredi-30-octobre-2026&quot;}"><td data-label="Classement" class=first>Notation de la dette (Fitch)</td><td data-label="Dernière position de la France">Revue prévue le 30 octobre 2026 (calendrier de l&#x27;Agence France Trésor) ; résultat non vérifié dans une source officielle</td><td data-label="Ce qu&#x27;octobre change">Le rejet du budget à 458 voix contre 0 (scrutin public de l&#x27;Assemblée) reste le principal risque pour la note.</td></tr><tr class="det" data-detail="{&quot;titre&quot;: &quot;Notation de la dette (Moody&#x27;s)&quot;, &quot;champs&quot;: [[&quot;Classement&quot;, &quot;Notation de la dette (Moody&#x27;s)&quot;], [&quot;Dernière position de la France&quot;, &quot;Aa3, perspective négative (communiqué du ministère de l&#x27;Économie ; date non vérifiée)&quot;], [&quot;Ce qu&#x27;octobre change&quot;, &quot;S&amp;P se prononce le 27 novembre (calendrier de l&#x27;Agence France Trésor).&quot;]], &quot;source&quot;: &quot;https://www.aft.gouv.fr/fr&quot;}"><td data-label="Classement" class=first>Notation de la dette (Moody&#x27;s)</td><td data-label="Dernière position de la France">Aa3, perspective négative (communiqué du ministère de l&#x27;Économie ; date non vérifiée)</td><td data-label="Ce qu&#x27;octobre change">S&amp;P se prononce le 27 novembre (calendrier de l&#x27;Agence France Trésor).</td></tr><tr class="det" data-detail="{&quot;titre&quot;: &quot;Déficit et dette (Union européenne)&quot;, &quot;champs&quot;: [[&quot;Classement&quot;, &quot;Déficit et dette (Union européenne)&quot;], [&quot;Dernière position de la France&quot;, &quot;5,4 % de déficit en 2026 (Conseil des ministres du 1er octobre) ; 119,1 % de dette au 2e trimestre 2026 (Eurostat), 3e rang de l&#x27;UE derrière la Grèce et l&#x27;Italie&quot;], [&quot;Ce qu&#x27;octobre change&quot;, &quot;L&#x27;objectif de 5,0 % pour 2027 repose sur un budget que l&#x27;Assemblée a rejeté (458 voix contre 0).&quot;]], &quot;source&quot;: &quot;https://ec.europa.eu/eurostat/web/products-euro-indicators/w/2-21102026-bp&quot;}"><td data-label="Classement" class=first>Déficit et dette (Union européenne)</td><td data-label="Dernière position de la France">5,4 % de déficit en 2026 (Conseil des ministres du 1er octobre) ; 119,1 % de dette au 2e trimestre 2026 (Eurostat), 3e rang de l&#x27;UE derrière la Grèce et l&#x27;Italie</td><td data-label="Ce qu&#x27;octobre change">L&#x27;objectif de 5,0 % pour 2027 repose sur un budget que l&#x27;Assemblée a rejeté (458 voix contre 0).</td></tr><tr class="det" data-detail="{&quot;titre&quot;: &quot;Éducation (PISA 2025, OCDE)&quot;, &quot;champs&quot;: [[&quot;Classement&quot;, &quot;Éducation (PISA 2025, OCDE)&quot;], [&quot;Dernière position de la France&quot;, &quot;Maths 458 points (OCDE : 463, -16 depuis 2022), lecture 456 (OCDE : 461, -18), sciences 483 (OCDE : 482, -4)&quot;], [&quot;Ce qu&#x27;octobre change&quot;, &quot;Aucune mesure pédagogique de fond n&#x27;a été votée en octobre. Effets visibles au plus tôt dans PISA 2029.&quot;]], &quot;source&quot;: &quot;https://gpseducation.oecd.org/CountryProfile?primaryCountry=FRA&amp;treshold=10&amp;topic=PI&quot;}"><td data-label="Classement" class=first>Éducation (PISA 2025, OCDE)</td><td data-label="Dernière position de la France">Maths 458 points (OCDE : 463, -16 depuis 2022), lecture 456 (OCDE : 461, -18), sciences 483 (OCDE : 482, -4)</td><td data-label="Ce qu&#x27;octobre change">Aucune mesure pédagogique de fond n&#x27;a été votée en octobre. Effets visibles au plus tôt dans PISA 2029.</td></tr><tr class="det" data-detail="{&quot;titre&quot;: &quot;Corruption (Eurobaromètre, Commission européenne)&quot;, &quot;champs&quot;: [[&quot;Classement&quot;, &quot;Corruption (Eurobaromètre, Commission européenne)&quot;], [&quot;Dernière position de la France&quot;, &quot;77 % des Français jugent la corruption répandue (UE : 71 %)&quot;], [&quot;Ce qu&#x27;octobre change&quot;, &quot;Octobre n&#x27;apporte rien sur ce point. À noter : la loi sur les ingérences étrangères, adoptée par le Sénat le 20 octobre (340 voix pour, 0 contre). Le plan national anticorruption 2025-2029 compte 36 mesures (rapport 2026 sur l&#x27;État de droit).&quot;]], &quot;source&quot;: &quot;https://www.senat.fr/dossier-legislatif/pjl25-913.html&quot;}"><td data-label="Classement" class=first>Corruption (Eurobaromètre, Commission européenne)</td><td data-label="Dernière position de la France">77 % des Français jugent la corruption répandue (UE : 71 %)</td><td data-label="Ce qu&#x27;octobre change">Octobre n&#x27;apporte rien sur ce point. À noter : la loi sur les ingérences étrangères, adoptée par le Sénat le 20 octobre (340 voix pour, 0 contre). Le plan national anticorruption 2025-2029 compte 36 mesures (rapport 2026 sur l&#x27;État de droit).</td></tr></tbody></table></div><p class="note">Ces classements paraissent avec un à trois ans de retard : octobre 2026 se lira dans l&#x27;indice de corruption de février 2027, les notations de fin 2026 et PISA 2029.</p></div></div><aside class="side"><div class="sidehead"><span>Détail</span><button class="unpin" type="button" hidden title="Fermer">✕</button></div><div class="sidebody"><p class="empty">Survolez ou touchez un élément : son détail s’affiche ici, avec le lien vers la source. Cliquez pour le garder affiché.</p></div></aside></div><div class="blk" id="blk13"><div class="col"><div class="prose"><h2 class="sec" id="sec6">6. À surveiller en novembre</h2><div class="clair"><b>EN CLAIR</b><p>En novembre, tout se joue au Sénat : il examine les deux budgets. Et le 27 novembre, une troisième agence de notation, S&amp;P, donne son verdict sur la France.</p></div></div></div></div><div class="blk hasside pair" id="blk14" data-pair="suivre">

</div><div class="blk" id="blk19"><div class="col"><div class="prose"><p class="note">Source : données ouvertes de l&#x27;Assemblée nationale (data.assemblee-nationale.fr), recalculées le 7 novembre 2026. Seuls les députés en poste sont classés ; 137 propositions de loi déposées par d&#x27;anciens députés ne sont pas attribuées à un groupe.</p></div></div></div><div class="blk hasside" id="blk20"><div class="col"><div class="prose"><h2 class="sec" id="sec8">8. Lobbying : qui intervient de l&#x27;extérieur, et combien</h2><div class="clair"><b>EN CLAIR</b><p>Les lobbies sont des entreprises, des associations ou des syndicats qui essaient de convaincre les élus et les ministres. C&#x27;est légal, mais ils doivent s&#x27;inscrire dans un registre public et déclarer ce qu&#x27;ils font. Les plus actifs sont des cabinets spécialisés qui travaillent pour des clients.</p></div><p class="sub">Calculé sur le fichier open data du registre HATVP, téléchargé le 7 novembre 2026 : 4 111 organisations, 113 548 actions déclarées.</p></div><div class="hint">↔ Faites glisser le schéma de gauche à droite</div><div class="svgscroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 161.0 1240 291.0" width="1240" height="291.0" style="width:100%;height:auto;display:block" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" ><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect y="161.0" width="1240" height="291.0" fill="#fcfcfb"/><text x="56" y="175" font-size="14" font-weight="700" fill="#0b0b0b">Actions de lobbying déclarées, par année d&#x27;exercice</text>

</div><div class="blk" id="blk29"><div class="col"><div class="prose"><p class="note">Seules des sources officielles sont retenues : l&#x27;État français, l&#x27;Union européenne, l&#x27;OCDE, le FMI et l&#x27;ONU. Les classements d&#x27;organisations privées (corruption, liberté de la presse, démocratie, compétitivité) ne sont plus utilisés : il n&#x27;existe pas d&#x27;équivalent public pour la presse et la démocratie. Non vérifiés : rang de la France au PISA, note Fitch, tendance de l&#x27;Eurobaromètre. Détails en section 14.</p></div></div></div><div class="blk hasside" id="blk30"><div class="col"><div class="prose"><h2 class="sec" id="sec10">10. Rappel : le parcours d&#x27;un projet de loi et ses garde-fous</h2><div class="clair"><b>EN CLAIR</b><p>Une loi passe par au moins six étapes avant d&#x27;exister, et plusieurs institutions peuvent la bloquer ou la corriger en chemin. Les cases bleues sont le chemin normal, les rouges les contrôles, les jaunes les raccourcis du gouvernement.</p></div></div><div class="hint">↔ Faites glisser le schéma de gauche à droite</div><div class="svgscroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 138.0 1240 522.0" width="1240" height="522.0" style="width:100%;height:auto;display:block" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" ><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect y="138.0" width="1240" height="522.0" fill="#fcfcfb"/><g class="det step" data-step="1" data-tip="Le texte est déposé : projet de loi (gouvernement) ou proposition de loi (parlementaire)" data-detail="{&quot;titre&quot;: &quot;1. Dépôt&quot;, &quot;champs&quot;: [[&quot;Rôle&quot;, &quot;Projet de loi : le gouvernement, après avis du Conseil d&#x27;État et étude d&#x27;impact Proposition de loi : un député ou un sénateur&quot;]], &quot;source&quot;: &quo ;: &quot;https://www.assemblee-nationale.fr/dyn/17/dossiers&quot;}"><td data-label="Poste" class=first>Tokens écrits en cache (5,4 millions)</td><td data-label="Hypothèse retenue">0,05 Wh pour 1 000 tokens</td><td data-label="Résultat">0,27 kWh</td><td data-label="D&#x27;où vient l&#x27;hypothèse">La lecture d&#x27;un texte (« prefill ») coûte environ 10 à 20 fois moins que la génération</td></tr><tr class="det" data-detail="{&quot;titre&quot;: &quot;Tokens relus depuis le cache (50 millions)&quot;, &quot;champs&quot;: [[&quot;Poste&quot;, &quot;Tokens relus depuis le cache (50 millions)&quot;], [&quot;Hypothèse retenue&quot;, &quot;0,01 Wh pour 1 000 tokens&quot;], [&quot;Résultat&quot;, &quot;0,50 kWh&quot;], [&quot;D&#x27;où vient l&#x27;hypothèse&quot;, &quot;Le cache évite de recalculer ; coût résiduel de mémoire et de transfert&quot;]], &quot;source&quot;: &quot;https://www.assemblee-nationale.fr/dyn/17/dossiers&quot;}"><td data-label="Poste" class=first>Tokens relus depuis le cache (50 millions)</td><td data-label="Hypothèse retenue">0,01 Wh pour 1 000 tokens</td><td data-label="Résultat">0,50 kWh</td><td data-label="D&#x27;où vient l&#x27;hypothèse">Le cache évite de recalculer ; coût résiduel de mémoire et de transfert</td></tr><tr class="det" data-detail="{&quot;titre&quot;: &quot;Téléchargements et calculs annexes&quot;, &quot;champs&quot;: [[&quot;Poste&quot;, &quot;Téléchargements et calculs annexes&quot;], [&quot;Hypothèse retenue&quot;, &quot;139 Mo (registre HATVP) + ~110 pages web + rendu du SVG&quot;], [&quot;Résultat&quot;, &quot;&lt; 0,02 kWh&quot;], [&quot;D&#x27;où vient l&#x27;hypothèse&quot;, &quot;Environ 0,03 kWh par gigaoctet transféré ; calculs locaux négligeables&quot;]], &quot;source&quot;: &quot;https://www.assemblee-nationale.fr/dyn/17/dossiers&quot;}"><td data-label="Poste" class=first>Téléchargements et calculs annexes</td><td data-label="Hypothèse retenue">139 Mo (registre HATVP) + ~110 pages web + rendu du SVG</td><td data-label=" au de refroidissement sur site)&quot;]], &quot;source&quot;: &quot;https://www.assemblee-nationale.fr/dyn/17/dossiers&quot;}"><td data-label="Poste" class=first>Eau</td><td data-label="Hypothèse retenue">1 litre par kWh</td><td data-label="Résultat">≈ 1,5 litre</td><td data-label="D&#x27;où vient l&#x27;hypothèse">Google : 0,26 ml par requête de 0,24 Wh (eau de refroidissement sur site)</td></tr></tbody></table></div><p class="">Repères : 1,6 kWh = deux jours de réfrigérateur, 50 heures d&#x27;ordinateur portable, 10 km en voiture électrique ; 0,6 kg de CO2 = 4 à 5 km en voiture à essence. La version mensuelle automatique visera deux à trois fois moins.</p><p class="note">Méthode : comptage des tokens dans le journal de la session (fichiers de transcription de l&#x27;assistant et de ses 14 sous-agents), puis application des hypothèses ci-dessus. Sources des ordres de grandeur : Google, « Measuring the environmental impact of AI inference » (août 2025) ; Sam Altman, « The Gentle Singularity » (juin 2025) ; Mistral AI, étude d&#x27;impact environnemental (juillet 2025) ; facteur d&#x27;émission EPA eGRID pour le réseau américain.</p></div></div><aside class="side"><div class="sidehead"><span>Détail</span><button class="unpin" type="button" hidden title="Fermer">✕</button></div><div class="sidebody"><p class="empty">Survolez ou touchez un élément : son détail s’affiche ici, avec le lien vers la source. Cliquez pour le garder affiché.</p></div></aside></div><div class="blk hasside" id="blk33"><div class="col"><div class="prose"><h2 class="sec" id="sec13">13. Lexique</h2><div class="clair"><b>EN CLAIR</b><p>Les mots du rapport, expliqués simplement.</p></div><div class="tblwrap"><table class="rt"><colgroup><col style="width:24.4%"><col style="width:75.6%"></colgroup><thead><tr><th>Terme</th><th>Ce que c&#x27;est</th></tr></thead><tbody><tr class="det" data-detail="{&quot;titre&quot;: &quot;Déficit et dette&quot;, &quot;champs&quot;: [[&quot;Terme&quot;, &quot;Déficit et  1956, "parcours": "Ancienne maire de Morteau et députée du Doubs, ex-secrétaire générale des Républicains. Ministre depuis septembre 2024.", "octobre": "Plan d'urgence pour l'agriculture annoncé le 7 octobre ; avantages fiscaux agricoles élargis par les députés le 30 octobre.", "url": "https://www.info.gouv.fr/"}, "Serge Papin": {"role": "Ministre des PME, du Commerce et du Pouvoir d'achat", "parti": "Sans parti", "ne": 1955, "parcours": "Ancien PDG des magasins Système U (2005-2018). Entré au gouvernement en octobre 2025.", "octobre": "Le « pacte Papin » du budget 2027 facilite la reprise d'entreprises par les salariés.", "url": "https://www.info.gouv.fr/"}, "Françoise Gatel": {"role": "Ministre de l'Aménagement du territoire et de la Décentralisation", "parti": "UDI (centre droit)", "ne": 1953, "parcours": "Ancienne maire de Châteaugiron et sénatrice d'Ille-et-Vilaine. Ministre depuis septembre 2024.", "octobre": "Porte la révision constitutionnelle sur l'autonomie de la Corse, rejetée par le Sénat le 26 octobre.", "url": "https://www.info.gouv.fr/"}, "Philippe Baptiste": {"role": "Ministre de l'Enseignement supérieur, de la Recherche et de l'Espace", "parti": "Sans parti", "ne": 1972, "parcours": "Ingénieur et chercheur, ancien président du CNES (agence spatiale). Ministre depuis décembre 2024.", "octobre": "Pas de texte en discussion ce mois-ci.", "url": "https://www.info.gouv.fr/"}, "Catherine Pégard": {"role": "Ministre de la Culture", "parti": "Sans parti", "ne": 1954, "parcours": "Journaliste politique, puis présidente du château de Versailles (2011-2024) et conseillère culture du président. A remplacé Rachida Dati le 26 février 2026.", "octobre": "Pas de texte en discussion ce mois-ci.", "url": "https://www.info.gouv.fr/"}, "Naïma Moutchou": {"role": "Ministre des Outre-mer", "parti": "Horizons", "ne": 1980, "parcours": "Avocate, députée du Val-d'Oise depuis 2017 et ancienne vice-présidente de l'Assemblée. Ministre depuis octobre 2025.", "octobre": "Concer <script>

window.initReport = function(PEOPLE){
  if (window.__cleanup) window.__cleanup();
  const tip = document.getElementById('tip');
  // Bascule diagramme / tableau
  const setView = (pair, v) => {
    pair.querySelectorAll('.view').forEach(d => d.hidden = !d.classList.contains(v));
    pair.querySelectorAll('.toggle button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  };
  document.querySelectorAll('.pair').forEach(pair => pair.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => setView(pair, b.dataset.view))));
  document.querySelectorAll('nav.toc [data-all]').forEach(b => b.addEventListener('click', () => document.querySelectorAll('.pair').forEach(p => setView(p, b.dataset.all))));
  // Sommaire : section courante
  const anchors = [...document.querySelectorAll('nav.toc a')];
  const onScroll = () => {
    let cur = null;
    anchors.forEach(a => { const el = document.querySelector(a.getAttribute('href')); if (el && el.getBoundingClientRect().top - 60 <= 0) cur = a; });
    anchors.forEach(a => a.classList.toggle('on', a === cur));
  };
  window.addEventListener('scroll', onScroll, {passive: true}); onScroll();
  const onKey = e => { if (e.key === 'Escape') { fiche.classList.remove('on'); } };
  window.__cleanup = () => { window.removeEventListener('scroll', onScroll); document.removeEventListener('keydown', onKey); };
  // Panneau latéral : survol = aperçu, clic = verrouillage
  const escH = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const render = (aside, el0) => {
    const el = el0.closest('[data-detail]') || el0;
    const body = aside.querySelector('.sidebody');
    let d = null; try { d = el.dataset.detail ? JSON.parse(el.dataset.detail) : null; } catch (e) {}
    if (d) {
      const host = d.source ? d.source.replace(/^https?:[/][/](www[.])?/, '').split('/')[0] : '';
      body.innerHTML = '<h4>' + escH(d.titre) + '</h4><dl>' + d.champs.map(([k, v]) => '<dt>' + escH(k) + '</dt><dd>' + escH(v) + '</dd>').join('') + '</dl>' +
        (d.source ? '<div class="src">Source : <a href="' + d.source + '" target="_blank" rel="noopener">' + escH(host) + ' ↗</a><br><span style="color:#898781">Pour aller plus loin, ouvrir la page d’origine.</span></div>' : '');
    } else if (el.dataset.tip) {
      body.innerHTML = '<p>' + escH(el.dataset.tip) + '</p>';
    }
  };
  document.querySelectorAll('.blk.hasside').forEach(blk => {
    const aside = blk.querySelector('aside.side'); if (!aside) return;
    const head = aside.querySelector('.sidehead'); const unpin = aside.querySelector('.unpin');
    let pinnedEl = null;
    const setPin = el => {
      if (pinnedEl) pinnedEl.classList.remove('sel');
      pinnedEl = el; unpin.hidden = !el; head.classList.toggle('pinned', !!el);
      head.firstElementChild.textContent = el ? 'Détail (gardé affiché)' : 'Détail';
      aside.classList.toggle('open', !!el);
      if (el) { el.classList.add('sel'); render(aside, el); }
    };
    blk.querySelectorAll('[data-detail], [data-tip]').forEach(el => {
      el.addEventListener('mouseenter', () => { if (!pinnedEl) render(aside, el); });
      el.addEventListener('click', e => { e.stopPropagation(); const t = el.closest('[data-detail]') || el; setPin(pinnedEl === t ? null : t); if (!pinnedEl) render(aside, t); });
      el.addEventListener('touchstart', () => { if (!pinnedEl) render(aside, el); }, {passive: true});
    });
    unpin.addEventListener('click', () => setPin(null));
    blk.addEventListener('click', e => { if (pinnedEl && !e.target.closest('[data-detail], [data-tip], aside')) setPin(null); });
  });
  const tb = document.getElementById('tocbtn');
  const closeToc = () => document.body.classList.remove('tocopen');
  tb.addEventListener('click', () => document.body.classList.toggle('tocopen'));
  document.getElementById('scrim').addEventListener('click', closeToc);
  document.querySelectorAll('nav.toc a').forEach(a => a.addEventListener('click', closeToc));
  // Fiches des ministres
  const fiche = document.getElementById('fiche'); const names = Object.keys(PEOPLE); let cur = -1;
  const openFiche = name => {
    const p = PEOPLE[name]; if (!p) return; cur = names.indexOf(name);
    fiche.querySelector('.medal').style.background = p.col; fiche.querySelector('.medal').textContent = p.ini;
    fiche.querySelector('h3').textContent = name; fiche.querySelector('.role').textContent = p.role;
    fiche.querySelector('.tags').innerHTML = '<span class="tag">' + p.parti + '</span>' + (p.ne ? '<span class="tag">né(e) en ' + p.ne + ', ' + (2026 - p.ne) + ' ans</span>' : '');
    fiche.querySelector('.parcours').innerHTML = '<b>Parcours.</b> ' + p.parcours;
    fiche.querySelector('.octobre').innerHTML = '<b>En octobre.</b> ' + p.octobre;
    fiche.querySelector('.lien').innerHTML = '<a href="' + p.url + '" target="_blank" rel="noopener">Site officiel du gouvernement (composition) ↗</a>';
    fiche.querySelector('.count').textContent = (cur + 1) + ' / ' + names.length;
    fiche.classList.add('on');
    document.querySelectorAll('svg .person').forEach(el => { if (el.dataset.person === name) el.classList.add('revealed'); });
  };
  document.querySelectorAll('svg .person').forEach(el => el.addEventListener('click', () => openFiche(el.dataset.person)));
  fiche.querySelector('.close').addEventListener('click', () => fiche.classList.remove('on'));
  fiche.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => openFiche(names[(cur + parseInt(b.dataset.dir) + names.length) % names.length])));
  document.addEventListener('keydown', onKey);
  // Mode quiz : cacher les noms, les révéler au clic
  const qb = document.getElementById('quizbtn');
  qb.addEventListener('click', () => {
    const on = document.body.classList.toggle('quiz'); qb.classList.toggle('on', on);
    document.querySelectorAll('svg .person').forEach(el => el.classList.remove('revealed'));
    qb.textContent = on ? 'Quiz en cours : cliquez sur un ministre pour révéler son nom (cliquer ici pour arrêter)' : 'Qui est-ce ? (cacher les noms des ministres)';
    if (on) { const org = document.querySelector('svg .person'); if (org) org.closest('.blk').scrollIntoView({behavior: 'smooth'}); }
  });
};

(function(){
  const rpt = document.getElementById('rpt'), panel = document.getElementById('histpanel'), btn = document.getElementById('histbtn');
  let year = null;
  const lab = k => SITE.mois[+k.slice(5) - 1] + ' ' + k.slice(0, 4);
  function drawPanel(cur) {
    year = year || cur.slice(0, 4);
    const hy = document.getElementById('hy'); hy.innerHTML = '';
    SITE.years.forEach(y => { const b = document.createElement('button'); b.textContent = y; b.setAttribute('aria-pressed', y === year); b.onclick = () => { year = y; drawPanel(cur); }; hy.appendChild(b); });
    document.getElementById('hm').innerHTML = SITE.mois.map((m, i) => { const k = year + '-' + String(i + 1).padStart(2, '0'); return SITE.keys.includes(k) ? '<a href="#' + k + '"' + (k === cur ? ' class="cur"' : '') + '>' + m + '</a>' : '<span>' + m + '</span>'; }).join('');
  }
  function show(k) {
    if (!SITE.keys.includes(k)) k = SITE.keys[SITE.keys.length - 1];
    rpt.innerHTML = ''; rpt.appendChild(document.getElementById('t-' + k).content.cloneNode(true));
    document.body.classList.remove('quiz', 'tocopen');
    initReport(SITE.people[k]);
    document.getElementById('histtitle').textContent = 'Compte rendu : ' + lab(k);
    document.title = SITE.titles[k]; drawPanel(k); panel.classList.remove('on'); btn.setAttribute('aria-expanded', 'false');
    window.scrollTo(0, 0);
  }
  btn.addEventListener('click', () => { const on = panel.classList.toggle('on'); btn.setAttribute('aria-expanded', on); });
  document.addEventListener('click', e => { if (!e.target.closest('#histpanel, #histbtn')) panel.classList.remove('on'); });
  window.addEventListener('hashchange', () => { if (/^#\d{4}-\d{2}$/.test(location.hash)) show(location.hash.slice(1)); });
  show(/^#\d{4}-\d{2}$/.test(location.hash) ? location.hash.slice(1) : SITE.keys[SITE.keys.length - 1]);
})();
</script></body></html>
